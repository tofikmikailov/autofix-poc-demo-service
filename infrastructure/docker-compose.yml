services:
  elasticsearch:
    image: elasticsearch:9.4.4
    container_name: autofix-elasticsearch
    environment:
      discovery.type: single-node
      xpack.security.enabled: "false"
      ES_JAVA_OPTS: "-Xms512m -Xmx512m"
    ports:
      - "127.0.0.1:9200:9200"
    volumes:
      - elasticsearch-data:/usr/share/elasticsearch/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "curl --fail http://localhost:9200/_cluster/health || exit 1"
        ]
      interval: 10s
      timeout: 5s
      retries: 20
    networks:
      - autofix-network

  kibana:
    image: kibana:9.4.4
    container_name: autofix-kibana
    environment:
      ELASTICSEARCH_HOSTS: "http://elasticsearch:9200"
      XPACK_SECURITY_ENABLED: "false"
      NODE_OPTIONS: "--max-old-space-size=1024"
    ports:
      - "127.0.0.1:5601:5601"
    depends_on:
      elasticsearch:
        condition: service_healthy
    networks:
      - autofix-network

  logstash:
    image: logstash:9.4.4
    container_name: autofix-logstash
    environment:
      XPACK_MONITORING_ENABLED: "false"
      LS_JAVA_OPTS: "-Xms256m -Xmx256m"
    ports:
      - "127.0.0.1:5000:5000"
      - "127.0.0.1:9600:9600"
    volumes:
      - ./logstash/pipeline:/usr/share/logstash/pipeline:ro
    depends_on:
      elasticsearch:
        condition: service_healthy
    networks:
      - autofix-network

  postgres:
    image: postgres:17-alpine
    container_name: autofix-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "127.0.0.1:15432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"
        ]
      interval: 5s
      timeout: 5s
      retries: 20
    networks:
      - autofix-network

  n8n:
    image: n8nio/n8n:2.31.7
    container_name: autofix-n8n
    restart: unless-stopped
    environment:
      DB_TYPE: postgresdb
      DB_POSTGRESDB_HOST: postgres
      DB_POSTGRESDB_PORT: 5432
      DB_POSTGRESDB_DATABASE: ${POSTGRES_DB}
      DB_POSTGRESDB_USER: ${POSTGRES_USER}
      DB_POSTGRESDB_PASSWORD: ${POSTGRES_PASSWORD}

      N8N_ENCRYPTION_KEY: ${N8N_ENCRYPTION_KEY}

      N8N_HOST: localhost
      N8N_PORT: 5678
      N8N_PROTOCOL: http

      N8N_SECURE_COOKIE: "false"

      GENERIC_TIMEZONE: Asia/Baku
      TZ: Asia/Baku

      N8N_DIAGNOSTICS_ENABLED: "false"
      N8N_PERSONALIZATION_ENABLED: "false"
      N8N_VERSION_NOTIFICATIONS_ENABLED: "false"

      # Jira Cloud base URL, referenced from workflow HTTP Request nodes
      # (e.g. reading available transitions) via {{ $env.JIRA_BASE_URL }}
      # instead of a hardcoded tenant domain.
      JIRA_BASE_URL: ${JIRA_BASE_URL}

      # Stage 6B: shared local secret validated by "05 - Get AutoFix
      # Ticket Context"'s Validate Request node via {{ $env.AUTOFIX_RUNNER_WEBHOOK_TOKEN }}.
      # Not a Jira credential -- only authenticates the local Agent Runner.
      AUTOFIX_RUNNER_WEBHOOK_TOKEN: ${AUTOFIX_RUNNER_WEBHOOK_TOKEN}

      # Containerized AutoFix Agent: bearer tokens used by Workflow 03's
      # dispatch call (POST autofix-agent:8090/api/jobs) and validated by
      # Workflow 04's callback (POST /webhook/autofix/agent-result).
      AUTOFIX_AGENT_API_TOKEN: ${AUTOFIX_AGENT_API_TOKEN}
      AUTOFIX_CALLBACK_TOKEN: ${AUTOFIX_CALLBACK_TOKEN}
      N8N_BLOCK_ENV_ACCESS_IN_NODE: "false"
    ports:
      - "127.0.0.1:5678:5678"
    volumes:
      - n8n-data:/home/node/.n8n
    depends_on:
      postgres:
        condition: service_healthy
      elasticsearch:
        condition: service_healthy
    networks:
      - autofix-network

  autofix-agent:
    build:
      context: ../autofix-agent
    container_name: autofix-agent
    restart: unless-stopped
    environment:
      AUTOFIX_AGENT_API_TOKEN: ${AUTOFIX_AGENT_API_TOKEN}
      AUTOFIX_CALLBACK_TOKEN: ${AUTOFIX_CALLBACK_TOKEN}
      AUTOFIX_CALLBACK_URL: "http://n8n:5678/webhook/autofix/agent-result"
      AUTOFIX_REPOSITORY_URL: ${AUTOFIX_REPOSITORY_URL}
      AUTOFIX_REPOSITORY_OWNER: ${AUTOFIX_REPOSITORY_OWNER}
      AUTOFIX_REPOSITORY_NAME: ${AUTOFIX_REPOSITORY_NAME}
      AUTOFIX_BASE_BRANCH: ${AUTOFIX_BASE_BRANCH:-main}
      GH_TOKEN: ${AUTOFIX_GITHUB_TOKEN}
      COPILOT_GITHUB_TOKEN: ${AUTOFIX_COPILOT_TOKEN}
    # No Jira/Postgres/Elasticsearch credentials, no Docker socket --
    # this container only ever talks to GitHub and to n8n's callback URL.
    ports:
      - "127.0.0.1:8090:8090"
    volumes:
      - autofix-agent-workspace:/workspace
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "curl --fail http://localhost:8090/health || exit 1"
        ]
      interval: 15s
      timeout: 5s
      retries: 20
    networks:
      - autofix-network

volumes:
  elasticsearch-data:
  postgres-data:
  n8n-data:
  autofix-agent-workspace:

networks:
  autofix-network:
    name: autofix-network
