input {
  tcp {
    id => "autofix-demo-tcp-input"
    host => "0.0.0.0"
    port => 5000
    codec => json_lines
  }
}

filter {
  if ![service] {
    mutate {
      add_field => {
        "service" => "unknown-service"
      }
    }
  }

  if ![environment] {
    mutate {
      add_field => {
        "environment" => "local"
      }
    }
  }

  # Stage 9: assign a stable per-event id up front and compute the exact
  # index name this event will land in. Both are shared between the
  # `elasticsearch` output (as the explicit document _id) and the `http`
  # push-webhook output below, so Workflow 01's push path and its
  # schedule-based fallback/reconciliation path agree on the same
  # (elasticsearch_id, elasticsearch_index) pair for
  # `processed_log_event` -- whichever path processes the event first
  # wins, and the other is a safe no-op (ON CONFLICT (elasticsearch_id)
  # DO NOTHING), never a duplicate incident.
  uuid {
    target => "event_id"
    overwrite => false
  }

  mutate {
    add_field => {
      "index_name" => "autofix-demo-logs-%{+YYYY.MM.dd}"
    }
  }
}

output {
  elasticsearch {
    id => "autofix-demo-elasticsearch-output"
    hosts => ["http://elasticsearch:9200"]
    index => "%{[index_name]}"
    document_id => "%{[event_id]}"
  }

  # Stage 9: push-trigger Workflow 01 immediately for ERROR-level events,
  # instead of waiting for its schedule-based poll (up to several minutes
  # of latency). Mirrors the same selection criteria as Workflow 01's
  # `Search Elasticsearch` node's query (level=ERROR, this service, and
  # excluding the DemoController bulk-error-generator endpoint) so the
  # push path and the poll/reconciliation path always agree on what
  # counts as an AutoFix candidate.
  if [level] == "ERROR"
     and [service] == "autofix-demo-service"
     and [logger] != "com.example.autofixdemo.controller.DemoController" {
    http {
      id => "autofix-demo-error-webhook-output"
      url => "http://n8n:5678/webhook/autofix/error-detected"
      http_method => "post"
      format => "json"
      headers => {
        "x-autofix-logstash-token" => "${AUTOFIX_LOGSTASH_WEBHOOK_TOKEN}"
      }
      # The underlying ES write above is the source of truth; this
      # webhook is a best-effort latency shortcut, not a hard
      # dependency -- retry transient failures, but never let a
      # webhook failure block or crash the pipeline (the schedule
      # trigger in Workflow 01 will pick up any missed event within
      # its fallback interval).
      automatic_retries => 2
      retry_non_idempotent => true
      ignorable_codes => [400, 401, 403, 404, 409]
    }
  }

  stdout {
    codec => rubydebug
  }
}
